[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aquatrack"
version = "0.1.0"
description = "Underwater fish detection, tracking, counting, and survey analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "PyYAML>=6.0,<7",
  "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dashboard = ["pandas>=2.2,<3", "streamlit>=1.40,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[project.scripts]
aquatrack = "aquatrack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aquatrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

