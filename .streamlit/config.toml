[theme]
base = "light"
primaryColor = "#0F6B78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F5"
textColor = "#202123"
linkColor = "#0F6B78"
borderColor = "#E2E2DE"
greenColor = "#16794F"
orangeColor = "#9A6700"
redColor = "#C2413B"
grayColor = "#6B6B66"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkUnderline = false

[theme.sidebar]
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#EFEFEB"
textColor = "#202123"
borderColor = "#E2E2DE"
primaryColor = "#0F6B78"
